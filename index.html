<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <title>Water Station Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="setup" class="login" hidden></section>

  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h1>Water Station Manager</h1>
      <p class="muted">Sign in to record sales, payments and expenses.</p>
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p id="loginErr" class="err-text" role="alert"></p>
    </form>
  </section>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Open menu">Menu</button>
      <strong id="bizName">Water Station</strong>
    </header>
    <nav id="nav" class="nav" aria-label="Main">
      <div class="brand" id="brand">Water Station</div>
      <a href="#dashboard" data-r="dashboard">Dashboard</a>
      <a href="#sell" data-r="sell">New sale</a>
      <a href="#sales" data-r="sales">Sales history</a>
      <a href="#customers" data-r="customers">Customers</a>
      <a href="#payment" data-r="payment">Receive payment</a>
      <a href="#expenses" data-r="expenses">Expenses</a>
      <a href="#products" data-r="products">Products and prices</a>
      <div class="navfoot">
        <span id="who" class="muted"></span>
        <button id="logoutBtn" class="btn small">Sign out</button>
      </div>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
